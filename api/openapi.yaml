openapi: 3.0.3
info:
  title: bigwaves API
  version: 0.1.0
  description: |
    Contract between the Go backend and the React frontend.
    Money, prices and quantities are decimal strings. Times are RFC3339 UTC.
    Every error is `{"error": {"code", "message", "details"}}` with a meaningful HTTP status.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: pairs
  - name: account
  - name: jobs
  - name: ema1d
paths:
  /me:
    get:
      tags: [system]
      operationId: getMe
      summary: Current signed-in user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /system:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Safety switches and environment, for the status indicators in the top bar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Error" }

  /pairs:
    get:
      tags: [pairs]
      operationId: listPairs
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PairStatus" }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Pair" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [pairs]
      operationId: createPair
      summary: Add a pair by its Binance symbol; coin and filters come from Binance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePairRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pair" }
        default: { $ref: "#/components/responses/Error" }

  /pairs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [pairs]
      operationId: getPair
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pair" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [pairs]
      operationId: updatePair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePairRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pair" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [pairs]
      operationId: deletePair
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /coins/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [pairs]
      operationId: updateCoin
      summary: Edit the coin's markdown description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, maxLength: 100000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coin" }
        default: { $ref: "#/components/responses/Error" }

  /account/balances:
    get:
      tags: [account]
      operationId: getBalances
      parameters:
        - name: refresh
          in: query
          description: Bypass the 30-second cache
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balances" }
        default: { $ref: "#/components/responses/Error" }

  /account/borrow:
    post:
      tags: [account]
      operationId: borrowUsdt
      summary: Borrow USDT on cross margin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        default: { $ref: "#/components/responses/Error" }

  /account/repay:
    post:
      tags: [account]
      operationId: repayUsdt
      summary: Repay USDT on cross margin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmountRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        default: { $ref: "#/components/responses/Error" }

  /account/transfer:
    post:
      tags: [account]
      operationId: transferUsdt
      summary: Move USDT between spot and cross margin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction, amount]
              properties:
                direction:
                  type: string
                  enum: [SPOT_TO_CROSS, CROSS_TO_SPOT]
                amount: { $ref: "#/components/schemas/Decimal" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        default: { $ref: "#/components/responses/Error" }

  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JobStatus" }
        default: { $ref: "#/components/responses/Error" }

  /jobs/{name}/runs:
    parameters:
      - $ref: "#/components/parameters/JobName"
    get:
      tags: [jobs]
      operationId: listJobRuns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JobRun" }
        default: { $ref: "#/components/responses/Error" }

  /jobs/{name}/run:
    parameters:
      - $ref: "#/components/parameters/JobName"
    post:
      tags: [jobs]
      operationId: runJob
      summary: Start the job now, in the background
      responses:
        "202": { description: Started }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/status:
    get:
      tags: [ema1d]
      operationId: getEma1dStatus
      summary: Capital, exposure, margin level, open positions, todos and the last sync
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dStatus" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/pairs:
    get:
      tags: [ema1d]
      operationId: listEma1dPairs
      summary: The basket, each pair with its position and what the last sync wanted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ema1dPairRow" } }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/pairs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [ema1d]
      operationId: updateEma1dPair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Ema1dPairUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dPairRow" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/pairs/check:
    post:
      tags: [ema1d]
      operationId: checkEma1dPairs
      summary: Check on Binance whether pairs trade on cross margin and can be shorted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ema1dPairCheck" } }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/todos:
    get:
      tags: [ema1d]
      operationId: listEma1dTodos
      parameters:
        - name: history
          in: query
          description: Every todo of the last 30 days instead of the ones that need attention
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ema1dTodo" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [ema1d]
      operationId: createEma1dTodo
      summary: Queue one OPEN or CLOSE by hand (same checks as the sync)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Ema1dManualTodoRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dManualTodoResult" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/todos/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [ema1d]
      operationId: retryEma1dTodo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dTodo" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/todos/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [ema1d]
      operationId: cancelEma1dTodo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dTodo" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/trades:
    get:
      tags: [ema1d]
      operationId: listEma1dTrades
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed], default: open }
        - name: coin
          in: query
          schema: { type: string }
        - name: side
          in: query
          schema: { $ref: "#/components/schemas/Side" }
        - name: month
          in: query
          description: YYYY-MM (open month for open positions, close month for closed ones)
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ema1dPosition" } }
                  summary: { $ref: "#/components/schemas/Ema1dTradesSummary" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/equity:
    get:
      tags: [ema1d]
      operationId: getEma1dEquity
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 3650, default: 180 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ema1dEquityPoint" } }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/signals:
    get:
      tags: [ema1d]
      operationId: getEma1dSignals
      summary: Where the strategy stands from the stored candles (no fetch, no sync)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dSignals" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/daily-checks:
    get:
      tags: [ema1d]
      operationId: listEma1dDailyChecks
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ema1dDailyCheck" } }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/config:
    get:
      tags: [ema1d]
      operationId: getEma1dConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dConfigEnvelope" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [ema1d]
      operationId: updateEma1dConfig
      summary: Save a new config; fails with 409 when version is stale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, config]
              properties:
                version: { type: integer, format: int64 }
                config: { $ref: "#/components/schemas/Ema1dConfig" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ema1dConfigEnvelope" }
        default: { $ref: "#/components/responses/Error" }

  /ema1d/config/history:
    get:
      tags: [ema1d]
      operationId: getEma1dConfigHistory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConfigChange" } }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    JobName:
      name: name
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Decimal:
      type: string
      format: decimal
      x-go-type: money.Dec
      x-go-type-import:
        path: bigwaves/internal/platform/money

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_failed }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }

    SystemStatus:
      type: object
      required: [env, tradingEnabled, schedulerEnabled]
      properties:
        env: { type: string }
        tradingEnabled:
          type: boolean
          description: When false no order, borrow, repay or transfer reaches Binance
        schedulerEnabled: { type: boolean }

    PairStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    Coin:
      type: object
      required: [id, name, description]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: SUN }
        description: { type: string, description: Markdown }

    Pair:
      type: object
      required: [id, name, quoteAsset, status, isSpot, isIsolated, coin, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: SUNUSDT }
        quoteAsset: { type: string, example: USDT }
        status: { $ref: "#/components/schemas/PairStatus" }
        coin: { $ref: "#/components/schemas/Coin" }
        currentPrice: { $ref: "#/components/schemas/Decimal" }
        priceUpdatedAt: { type: string, format: date-time }
        interestRate:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Yearly borrow rate of the base asset, in percent
        stepSize: { $ref: "#/components/schemas/Decimal" }
        minNotional: { $ref: "#/components/schemas/Decimal" }
        isSpot: { type: boolean }
        isIsolated: { type: boolean }
        deletedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    CreatePairRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: SUNUSDT }
        isSpot: { type: boolean, default: false }
        isIsolated: { type: boolean, default: false }

    UpdatePairRequest:
      type: object
      properties:
        status: { $ref: "#/components/schemas/PairStatus" }
        isSpot: { type: boolean }
        isIsolated: { type: boolean }

    Balances:
      type: object
      required: [spotUsdtFree, crossUsdtFree, crossUsdtDebt, crossDebtUsdt, marginLevel, spotTotalUsdt, crossTotalUsdt, netTotalUsdt, fetchedAt]
      properties:
        spotUsdtFree: { $ref: "#/components/schemas/Decimal" }
        crossUsdtFree: { $ref: "#/components/schemas/Decimal" }
        crossUsdtDebt:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: USDT borrowed plus interest
        crossDebtUsdt:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Every borrowed asset valued in USDT
        marginLevel: { $ref: "#/components/schemas/Decimal" }
        spotTotalUsdt: { $ref: "#/components/schemas/Decimal" }
        crossTotalUsdt: { $ref: "#/components/schemas/Decimal" }
        netTotalUsdt: { $ref: "#/components/schemas/Decimal" }
        fetchedAt: { type: string, format: date-time }

    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount: { $ref: "#/components/schemas/Decimal" }

    TransferResult:
      type: object
      required: [tranId]
      properties:
        tranId: { type: integer, format: int64 }

    JobRunStatus:
      type: string
      enum: [RUNNING, OK, FAILED, SKIPPED]

    JobRun:
      type: object
      required: [id, job, trigger, status, message, startedAt]
      properties:
        id: { type: integer, format: int64 }
        job: { type: string }
        trigger: { type: string, enum: [schedule, manual] }
        status: { $ref: "#/components/schemas/JobRunStatus" }
        message: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    JobStatus:
      type: object
      required: [name, description, cron, running]
      properties:
        name: { type: string }
        description: { type: string }
        cron: { type: string }
        running: { type: boolean }
        nextRunAt: { type: string, format: date-time }
        lastRun: { $ref: "#/components/schemas/JobRun" }

    Side:
      type: string
      enum: [LONG, SHORT]

    ConfigChange:
      type: object
      required: [id, before, after, userEmail, createdAt]
      properties:
        id: { type: integer, format: int64 }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        userEmail: { type: string }
        createdAt: { type: string, format: date-time }

    Ema1dSizes:
      type: object
      required: [coreLong, coreShort, sensitiveLong, sensitiveShort]
      properties:
        coreLong: { $ref: "#/components/schemas/Decimal" }
        coreShort: { $ref: "#/components/schemas/Decimal" }
        sensitiveLong: { $ref: "#/components/schemas/Decimal" }
        sensitiveShort: { $ref: "#/components/schemas/Decimal" }

    Ema1dConfig:
      type: object
      required: [enabled, pauseOpen, dailyCheckEnabled, budgetUsdt, maxEntryAgeDays, sizes, marginLevelWarn, marginLevelAlert]
      properties:
        enabled: { type: boolean, description: Executes the todo queue }
        pauseOpen: { type: boolean, description: Blocks new entries; closes still run }
        dailyCheckEnabled: { type: boolean, description: "Runs the 07:03 VN daily check" }
        budgetUsdt: { $ref: "#/components/schemas/Decimal" }
        maxEntryAgeDays: { type: integer, minimum: 0, maximum: 30 }
        sizes: { $ref: "#/components/schemas/Ema1dSizes" }
        marginLevelWarn: { $ref: "#/components/schemas/Decimal" }
        marginLevelAlert: { $ref: "#/components/schemas/Decimal" }

    Ema1dConfigEnvelope:
      type: object
      required: [config, version, suggestedSizes]
      properties:
        config: { $ref: "#/components/schemas/Ema1dConfig" }
        version: { type: integer, format: int64 }
        suggestedSizes: { $ref: "#/components/schemas/Ema1dSizes" }

    Ema1dCapital:
      type: object
      required: [budgetUsdt, realizedProfitUsdt, equityUsdt, unrealizedProfitUsdt, interestPaidUsdt, feePaidUsdt, closedPositions]
      properties:
        budgetUsdt: { $ref: "#/components/schemas/Decimal" }
        realizedProfitUsdt: { $ref: "#/components/schemas/Decimal" }
        equityUsdt: { $ref: "#/components/schemas/Decimal" }
        unrealizedProfitUsdt: { $ref: "#/components/schemas/Decimal" }
        interestPaidUsdt: { $ref: "#/components/schemas/Decimal" }
        feePaidUsdt: { $ref: "#/components/schemas/Decimal" }
        closedPositions: { type: integer }

    Ema1dExposure:
      type: object
      required: [longUsdt, shortUsdt, longCount, shortCount]
      properties:
        longUsdt: { $ref: "#/components/schemas/Decimal" }
        shortUsdt: { $ref: "#/components/schemas/Decimal" }
        longPercent: { $ref: "#/components/schemas/Decimal" }
        shortPercent: { $ref: "#/components/schemas/Decimal" }
        longCount: { type: integer }
        shortCount: { type: integer }

    Ema1dMarginLevel:
      type: object
      required: [warn, alert]
      properties:
        value: { $ref: "#/components/schemas/Decimal" }
        at: { type: string, format: date-time }
        warn: { $ref: "#/components/schemas/Decimal" }
        alert: { $ref: "#/components/schemas/Decimal" }

    Ema1dSizeRow:
      type: object
      required: [key, percent, suggestedPercent]
      properties:
        key: { type: string }
        percent: { $ref: "#/components/schemas/Decimal" }
        suggestedPercent: { $ref: "#/components/schemas/Decimal" }

    Ema1dPosition:
      type: object
      required: [id, coin, pairName, side, status, signalDate, amount, notionalUsdt, sizePercent, profitUsdt, feeUsdt, interestUsdt]
      properties:
        id: { type: integer, format: int64 }
        coin: { type: string }
        pairName: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        status: { type: string, enum: [OPENING, OPEN, CLOSED] }
        signalDate: { type: string, format: date }
        exitRule: { type: string, enum: [DIV4H, XO] }
        amount: { $ref: "#/components/schemas/Decimal" }
        openPrice: { $ref: "#/components/schemas/Decimal" }
        refOpenPrice: { $ref: "#/components/schemas/Decimal" }
        openSlippagePercent: { $ref: "#/components/schemas/Decimal" }
        closePrice: { $ref: "#/components/schemas/Decimal" }
        refClosePrice: { $ref: "#/components/schemas/Decimal" }
        closeSlippagePercent: { $ref: "#/components/schemas/Decimal" }
        currentPrice: { $ref: "#/components/schemas/Decimal" }
        notionalUsdt: { $ref: "#/components/schemas/Decimal" }
        sizePercent: { $ref: "#/components/schemas/Decimal" }
        equityPercent: { $ref: "#/components/schemas/Decimal" }
        profitUsdt:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Unrealized for open positions, realized for closed ones
        profitPercent: { $ref: "#/components/schemas/Decimal" }
        feeUsdt: { $ref: "#/components/schemas/Decimal" }
        interestUsdt: { $ref: "#/components/schemas/Decimal" }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        daysHeld: { type: integer }

    Ema1dTodo:
      type: object
      required: [id, coin, action, side, signalDate, status, source, attempts, lastError, cancellable, retryable, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        coin: { type: string }
        action: { type: string, enum: [OPEN, CLOSE] }
        side: { $ref: "#/components/schemas/Side" }
        signalDate: { type: string, format: date }
        status: { type: string, enum: [PENDING, RUNNING, DONE, FAILED, SKIPPED, CANCELLED] }
        source: { type: string, enum: [SYNC, MANUAL] }
        refPrice: { $ref: "#/components/schemas/Decimal" }
        exitRule: { type: string, enum: [DIV4H, XO] }
        attempts: { type: integer, format: int64 }
        runAfter: { type: string, format: date-time }
        lastError: { type: string }
        step: { type: string, enum: [BORROWING, BORROWED, BORROW_REVERTED] }
        dependsOnId: { type: integer, format: int64 }
        positionId: { type: integer, format: int64 }
        cancellable: { type: boolean }
        retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Ema1dSkipped:
      type: object
      required: [coin, action, side, reason]
      properties:
        coin: { type: string }
        action: { type: string }
        side: { type: string }
        reason: { type: string }

    Ema1dLastSync:
      type: object
      required: [runId, date, at, createdTodos, skipped, warnings]
      properties:
        runId: { type: string }
        date: { type: string, format: date }
        at: { type: string, format: date-time }
        createdTodos: { type: integer }
        skipped: { type: array, items: { $ref: "#/components/schemas/Ema1dSkipped" } }
        warnings: { type: array, items: { type: string } }

    Ema1dStatus:
      type: object
      required: [generatedAt, enabled, pauseOpen, dailyCheckEnabled, tradingEnabled, capital, exposure, marginLevel, sizes, openPositions, todos, syncMissingToday]
      properties:
        generatedAt: { type: string, format: date-time }
        enabled: { type: boolean }
        pauseOpen: { type: boolean }
        dailyCheckEnabled: { type: boolean }
        tradingEnabled: { type: boolean }
        capital: { $ref: "#/components/schemas/Ema1dCapital" }
        exposure: { $ref: "#/components/schemas/Ema1dExposure" }
        marginLevel: { $ref: "#/components/schemas/Ema1dMarginLevel" }
        sizes: { type: array, items: { $ref: "#/components/schemas/Ema1dSizeRow" } }
        openPositions: { type: array, items: { $ref: "#/components/schemas/Ema1dPosition" } }
        todos: { type: array, items: { $ref: "#/components/schemas/Ema1dTodo" } }
        lastSync: { $ref: "#/components/schemas/Ema1dLastSync" }
        syncMissingToday: { type: boolean }

    Ema1dPairRow:
      type: object
      required: [id, pairId, coin, pairName, pairGroup, status, allowLong, allowShort, shortSupported, addedOn, checkNote, pendingTodos, mismatch]
      properties:
        id: { type: integer, format: int64 }
        pairId: { type: integer, format: int64 }
        coin: { type: string }
        pairName: { type: string }
        pairGroup: { type: string, enum: [CORE, SENSITIVE] }
        status: { type: string, enum: [ACTIVE, EXIT_ONLY, DISABLED] }
        allowLong: { type: boolean }
        allowShort: { type: boolean }
        shortSupported: { type: boolean }
        longExitRule: { type: string, enum: [DIV4H, XO] }
        addedOn: { type: string, format: date }
        removedOn: { type: string, format: date }
        signalFrom: { type: string, format: date }
        checkNote: { type: string }
        checkedAt: { type: string, format: date-time }
        currentPrice: { $ref: "#/components/schemas/Decimal" }
        position:
          type: object
          required: [positionId, side, status, signalDate, unrealizedProfitUsdt]
          properties:
            positionId: { type: integer, format: int64 }
            side: { $ref: "#/components/schemas/Side" }
            status: { type: string }
            signalDate: { type: string, format: date }
            unrealizedProfitUsdt: { $ref: "#/components/schemas/Decimal" }
            unrealizedPercent: { $ref: "#/components/schemas/Decimal" }
        wanted:
          type: object
          required: [state, syncDate]
          properties:
            state: { type: string, enum: [L, S, F] }
            entryDate: { type: string, format: date }
            rule: { type: string }
            syncDate: { type: string, format: date }
        pendingTodos: { type: array, items: { type: string } }
        mismatch: { type: boolean, description: Held position differs from the strategy and nothing is queued }

    Ema1dPairUpdate:
      type: object
      properties:
        pairGroup: { type: string, enum: [CORE, SENSITIVE] }
        status: { type: string, enum: [ACTIVE, EXIT_ONLY, DISABLED] }
        allowLong: { type: boolean }
        allowShort: { type: boolean }
        addedOn: { type: string, format: date }
        removedOn: { type: string, description: "YYYY-MM-DD, empty to clear" }
        longExitRule: { type: string, description: "DIV4H, XO or empty" }
        signalFrom: { type: string, description: "YYYY-MM-DD, empty to clear" }

    Ema1dPairCheck:
      type: object
      required: [coin, shortSupported, crossMargin, note]
      properties:
        coin: { type: string }
        shortSupported: { type: boolean }
        crossMargin: { type: boolean }
        note: { type: string }

    Ema1dManualTodoRequest:
      type: object
      required: [action, coin]
      properties:
        action: { type: string, enum: [OPEN, CLOSE] }
        coin: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        signalDate: { type: string, format: date }
        refPrice: { type: string }
        rule: { type: string, enum: [DIV4H, XO] }
        force: { type: boolean, description: Lifts the entry age limit only }

    Ema1dManualTodoResult:
      type: object
      required: [created, todo]
      properties:
        created: { type: boolean }
        todo: { $ref: "#/components/schemas/Ema1dTodo" }

    Ema1dTradesSummary:
      type: object
      required: [count, totalProfitUsdt, interestUsdt, feeUsdt]
      properties:
        count: { type: integer }
        totalProfitUsdt: { $ref: "#/components/schemas/Decimal" }
        winRatePercent: { $ref: "#/components/schemas/Decimal" }
        avgWinUsdt: { $ref: "#/components/schemas/Decimal" }
        avgLossUsdt: { $ref: "#/components/schemas/Decimal" }
        interestUsdt: { $ref: "#/components/schemas/Decimal" }
        feeUsdt: { $ref: "#/components/schemas/Decimal" }

    Ema1dEquityPoint:
      type: object
      required: [date, equityUsdt]
      properties:
        date: { type: string, format: date }
        equityUsdt: { $ref: "#/components/schemas/Decimal" }
        marginLevel: { $ref: "#/components/schemas/Decimal" }

    Ema1dSignalRow:
      type: object
      description: One line of the strategy status table (status.py columns)
      required: [pair, ngay, gia, ema_open, cat_hom_nay, lenh, lai, thoat_theo, hanh_dong_hom_nay, nhom, ghi_chu, open]
      properties:
        pair: { type: string }
        ngay: { type: string }
        gia: { type: number, format: double }
        ema_open: { type: string }
        cat_hom_nay: { type: string }
        lenh: { type: string }
        vao: { type: string, nullable: true }
        gia_vao: { type: number, format: double, nullable: true }
        lai: { type: string }
        thoat_theo: { type: string }
        hanh_dong_hom_nay: { type: string }
        nhom: { type: string }
        ghi_chu: { type: string }
        open: { type: boolean }
        side: { type: string }

    Ema1dSignals:
      type: object
      required: [date, rows, s, warnings]
      properties:
        date: { type: string }
        rows: { type: array, items: { $ref: "#/components/schemas/Ema1dSignalRow" } }
        s: { type: string, description: The sync string }
        warnings: { type: array, items: { type: string } }

    Ema1dDailyCheck:
      type: object
      required: [signalDate, status, runId, attempts, report, lastError]
      properties:
        signalDate: { type: string, format: date }
        status: { type: string, enum: [PENDING, SYNCED, SENT, FAILED] }
        runId: { type: string }
        attempts: { type: integer, format: int64 }
        report: { type: string }
        lastError: { type: string }
        syncedAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
