openapi: 3.0.3
info:
  title: bigwaves API
  version: 0.1.0
  description: |
    Contract between the Go backend and the React frontend.
    Money, prices and quantities are decimal strings. Times are RFC3339 UTC.
servers:
  - url: /api/v1
tags:
  - name: system
paths:
  /me:
    get:
      tags: [system]
      operationId: getMe
      summary: Current signed-in user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: validation_failed
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
