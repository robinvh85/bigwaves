name: ci-frontend
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'api/**', '.github/workflows/ci-frontend.yml']
  pull_request:
    paths: ['frontend/**', 'api/**', '.github/workflows/ci-frontend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
