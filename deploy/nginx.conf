# Alternative to Caddy (lighter RAM, TLS via certbot). Install as
# /etc/nginx/sites-available/bigwaves, replace __SITE__ with the domain, then run
# `certbot --nginx -d <domain>` to add the TLS server block.
server {
    listen 80;
    listen [::]:80;
    server_name __SITE__;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
